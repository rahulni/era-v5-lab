# CI only, on the fork branch g9-eval-lag-live-ci. Not part of any pull request.
# Runs the lag alarm's tests, including the live ClickHouse test, against the ClickHouse version and settings in
# teams/08-monitoring/clickhouse/README.md section 1.
name: eval-lag-live

on:
  push:
    branches: [g9-eval-lag-live-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8-alpine
        env:
          CLICKHOUSE_DB: default
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:8123/ping || exit 1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: ClickHouse version
        run: curl -sS "http://127.0.0.1:8123/?query=SELECT%20version()"
      - name: Lag alarm tests, with the live ClickHouse test
        env:
          CLICKHOUSE_URL: http://127.0.0.1:8123
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -o pipefail
          python -m pytest teams/08-monitoring/alarms/tests/test_eval_lag.py -v -rs -p no:cacheprovider --tb=short 2>&1 | tee pytest.log
      # Job logs need admin rights to read, annotations don't: publish the pytest output as annotations.
      - name: Test output as annotations
        if: always()
        run: |
          python - <<'EOF'
          lines = open("pytest.log", encoding="utf-8", errors="replace").read().splitlines()
          summary = [ln for ln in lines if ln.startswith(("PASSED", "FAILED", "ERROR", "SKIPPED", "="))]
          chunks = ["\n".join(summary[-40:])] + ["\n".join(lines[i:i + 70]) for i in range(0, len(lines), 70)][-8:]
          for n, chunk in enumerate(chunks):
              text = chunk.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::warning title=pytest {n}::{text}")
          EOF
